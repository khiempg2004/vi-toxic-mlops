[project]
name = "vitoxic"
version = "0.1.0"
description = "MLOps pipeline for Vietnamese toxic comment moderation with fine-tuned LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",  # evidently chưa tương thích pandas 3
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "httpx>=0.27",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
]
train = [
    "torch==2.8.0",
    "transformers>=4.51,<4.58",
    "peft>=0.15,<0.18",
    "accelerate>=1.6",
    "wandb>=0.19",
]
monitor = [
    "evidently>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "dvc>=3.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitoxic"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
